apiVersion: apps/v1
kind: Deployment
metadata:
  name: yachanki-kichua
  namespace: yachanki-kichua
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yachanki-kichua
  template:
    metadata:
      labels:
        app: yachanki-kichua
    spec:
      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.2.4
          args:
            - --repo=https://github.com/GoranTopic/yachanki-kichua
            - --ref=main
            - --root=/site
            - --link=current
            - --period=60s
          volumeMounts:
            - name: site
              mountPath: /site
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /site
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: site
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: yachanki-kichua
  namespace: yachanki-kichua
spec:
  selector:
    app: yachanki-kichua
  ports:
    - name: http
      port: 80
      targetPort: 80
