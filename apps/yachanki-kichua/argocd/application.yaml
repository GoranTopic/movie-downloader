apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yachanki-kichua
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GoranTopic/movie-downloader.git
    targetRevision: main
    path: apps/yachanki-kichua/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: yachanki-kichua
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
